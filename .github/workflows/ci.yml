name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: python3 -m pip install --quiet pyyaml

      - name: YAML 语法校验
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          ok = True
          files = glob.glob(".github/workflows/*.yml") + glob.glob("docker/*.yml")
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding="utf-8")))
                  print("OK:", f)
              except Exception as e:
                  ok = False
                  print("FAIL:", f, e)
          sys.exit(0 if ok else 1)
          PY

      - name: Shell 语法校验
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Python 语法校验
        run: |
          python3 -m py_compile scripts/run_test_suite.py && echo "OK: scripts/run_test_suite.py"

      - name: Dockerfile 存在性检查
        run: 'test -f docker/Dockerfile && echo "OK: docker/Dockerfile"'
